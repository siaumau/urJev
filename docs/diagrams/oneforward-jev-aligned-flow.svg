<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg{fill:#f7f4ed}.ink{fill:#111827}.muted{fill:#586174}.green{fill:#159947}.blue{fill:#155eef}.card{fill:#fff;stroke:#d6dae3;stroke-width:2}.line{stroke:#159947;stroke-width:6;fill:none;marker-end:url(#arrow)}
      .h1{font:700 52px system-ui,"Noto Sans TC",sans-serif}.h2{font:700 30px system-ui,"Noto Sans TC",sans-serif}.body{font:24px system-ui,"Noto Sans TC",sans-serif}.small{font:20px system-ui,"Noto Sans TC",sans-serif}.mono{font:22px ui-monospace,monospace}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#159947"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="h1 ink" x="80" y="90">調整方案：直接讀候選 logits，一題只做一次決策</text>
  <text class="body muted" x="80" y="135">先做 OneForward 實驗；保留現有產生式路徑作基準與 fallback</text>

  <rect class="card" x="70" y="200" rx="24" width="300" height="250"/>
  <text class="h2 ink" x="110" y="260">State＋問題</text>
  <text class="body muted" x="110" y="315">情緒屬於哪一類？</text>
  <text class="mono ink" x="110" y="370">positive</text>
  <text class="mono ink" x="110" y="405">negative</text>
  <text class="mono ink" x="110" y="440">mixed …</text>

  <path class="line" d="M370 325H465"/>
  <rect class="card" x="475" y="175" rx="24" width="400" height="530"/>
  <text class="h2 ink" x="515" y="235">單次 forward</text>
  <text class="body muted" x="515" y="290">不呼叫 JSON 生成迴圈</text>
  <text class="body muted" x="515" y="330">不產生解釋或多個數字</text>
  <rect x="515" y="385" width="320" height="180" rx="18" fill="#e7f7ed"/>
  <text class="mono ink" x="550" y="435">logit(positive) = -2.1</text>
  <text class="mono ink" x="550" y="480">logit(negative) =  1.3</text>
  <text class="mono ink" x="550" y="525">logit(mixed) =  2.2</text>
  <text class="body green" x="515" y="625">五題仍可放進同一個 GPU batch</text>

  <path class="line" d="M875 440H970"/>
  <rect class="card" x="980" y="175" rx="24" width="540" height="530"/>
  <text class="h2 ink" x="1020" y="235">限定選項 softmax</text>
  <g class="mono ink">
    <text x="1020" y="310">positive   0.009</text>
    <text x="1020" y="355">negative   0.288</text>
    <text x="1020" y="400">mixed      0.700</text>
  </g>
  <rect x="1020" y="455" width="450" height="90" rx="16" fill="#e8efff"/>
  <text class="h2 blue" x="1050" y="512">結果：mixed</text>
  <text class="body muted" x="1020" y="605">Choice：argmax　Noul：P(true)</text>
  <text class="body muted" x="1020" y="650">Score：Σ 等級 × 機率</text>

  <rect x="70" y="755" width="1450" height="95" rx="18" fill="#111827"/>
  <text class="body" fill="#fff" x="105" y="798">與 Jev 對齊之處：封閉選項、無自由文字、直接輸出分布、可批次處理。</text>
  <text class="small" fill="#cbd5e1" x="105" y="830">尚未對齊：Jev 的專有架構、平行 sampler、RLCD 與校準 confidence 未公開；第一版機率必須標示「未校準」。</text>
</svg>
