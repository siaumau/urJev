<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg{fill:#f7f4ed}.ink{fill:#111827}.muted{fill:#586174}.blue{fill:#155eef}.card{fill:#fff;stroke:#d6dae3;stroke-width:2}.line{stroke:#155eef;stroke-width:6;fill:none;marker-end:url(#arrow)}
      .h1{font:700 52px system-ui,"Noto Sans TC",sans-serif}.h2{font:700 30px system-ui,"Noto Sans TC",sans-serif}.body{font:24px system-ui,"Noto Sans TC",sans-serif}.small{font:20px system-ui,"Noto Sans TC",sans-serif}.mono{font:22px ui-monospace,monospace}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#155eef"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="h1 ink" x="80" y="90">目前 urJev：五題並行，但每題仍逐 token 生成 JSON</text>
  <text class="body muted" x="80" y="135">Qwen3-4B-Instruct-2507 · vLLM · Intel Arc Pro B70</text>

  <rect class="card" x="70" y="210" rx="24" width="300" height="230"/>
  <text class="h2 ink" x="110" y="270">同一份 State</text>
  <text class="body muted" x="110" y="320">客服回饋、JSON、文字</text>
  <text class="mono ink" x="110" y="375">{ feedback: ... }</text>

  <path class="line" d="M370 325H475"/>
  <rect class="card" x="485" y="175" rx="24" width="370" height="530"/>
  <text class="h2 ink" x="525" y="230">5 個獨立模型請求</text>
  <g class="body ink">
    <text x="525" y="295">① 主題 Choice</text><text x="525" y="365">② 情緒 Choice</text>
    <text x="525" y="435">③ 退款 Noul</text><text x="525" y="505">④ 續訂 Noul</text>
    <text x="525" y="575">⑤ 不滿 Score</text>
  </g>
  <text class="small muted" x="525" y="645">同時送入 vLLM，最多 8 題並行</text>

  <path class="line" d="M855 440H950"/>
  <rect class="card" x="960" y="175" rx="24" width="560" height="530"/>
  <text class="h2 ink" x="1000" y="230">每題內部：自回歸解碼</text>
  <text class="body muted" x="1000" y="285">先產生第一個 token，再逐個產生後續 token</text>
  <g class="mono ink">
    <text x="1000" y="355">{ → "mixed" → : → 70 → , → ... }</text>
    <text x="1000" y="415">約 12–26 tokens／題</text>
  </g>
  <rect x="1000" y="465" width="470" height="90" rx="16" fill="#e8efff"/>
  <text class="h2 blue" x="1030" y="520">最慢題目決定整體等待時間</text>
  <text class="body muted" x="1000" y="610">模型生成權重 JSON → Ajv 驗證 → 正規化 → 卡片結果</text>
  <text class="body ink" x="1000" y="665">本機五題：約 500 ms 上下</text>

  <rect x="70" y="770" width="1450" height="70" rx="18" fill="#111827"/>
  <text class="body" fill="#fff" x="105" y="815">重點：題目之間有並行；每題仍需多次解碼，所以目前只是 Jev 風格介面，不是 Jev 式決策核心。</text>
</svg>
